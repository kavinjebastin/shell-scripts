ADO_PROJECT="ClarityUAD"

DEFAULT_REVIEWERS="j.sanjeev@claritytts.com sp.kavin@claritytts.com"
PR_TITLE_TEMPLATE="skip-review : {source} to {target} ({date}) sync"

# Branch name prefix for tag sources (-r repo@tag): PRs open from <prefix><tag>
TAG_BRANCH_PREFIX="backmerge/"

# repo|source_branch|comma-separated targets (in order)|skip_dev(true|false)
# Missing target branches are auto-skipped at runtime.
# List the full branch ladder in targets, including the repo's own source branch:
# target == source is dropped at runtime, so the self-merge never happens, and the
# branch is still available as a target when -r repo:source overrides the source.
REPOS=(
    "OTP-UI-4|main|dev,qa,uat,preprod,main,release/air-asia|true"
    "b2b2c-Api|main|dev,qa,uat,preprod,main,release/air-arabia,release/air-asia,release/riyadh-ndc|true"
    "otp-engine-v2|main|dev,qa,uat,pre-prod,main,release/air-arabia,release/air-asia,release/riyadh-ndc|true"
    "Clarity-Voyage|main|qa,uat,preprod,main|true"
    "Common-Search-Service|main|dev,main,release/air-asia,release/air-arabia,release/riyadh-ndc|false"
)
