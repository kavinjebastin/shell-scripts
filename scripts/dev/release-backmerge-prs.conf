PR_TITLE_TEMPLATE="skip-review : {source} to {target} ({date}) sync"

# repo|source_branch|comma-separated targets (in order)|skip_dev(true|false)
# Missing target branches are auto-skipped at runtime.
# List the full branch ladder in targets, including the repo's own source branch:
# target == source is dropped at runtime, so the self-merge never happens, and the
# branch is still available as a target when -r repo:source overrides the source.
REPOS=(
    "OTP-UI-4|uat|dev,qa,uat,preprod,main|true"
    "b2b2c-Api|qa|dev,qa,uat,preprod,main|true"
    "otp-engine-v2|qa|dev,qa,uat,pre-prod,main|true"
    "Clarity-Voyage|qa|qa,uat,preprod,main|true"
    "Common-Search-Service|dev|dev,main|false"
)
